<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO • LOS VERBOS</title><style>
:root{--y:#fff36a;--yb:#d9c900;--b:#8fd3ff;--bb:#318dc7;--r:#ff987f;--rb:#cf5c45;--g:#8ddd72;--gb:#45a13f;--p:#c9b5f7;--pb:#846cc3}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,sans-serif}.app{height:100vh;max-width:1050px;margin:auto;padding:5px 10px;display:flex;flex-direction:column}h1{text-align:center;margin:0;color:#087ee7;font-size:clamp(20px,3vh,34px)}.ins{text-align:center;color:#555;font-weight:bold;font-size:clamp(9px,1.4vh,13px);margin:2px}.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto repeat(5,1fr);gap:4px}.h,.c{border:3px solid;border-radius:10px;text-align:center}.h{font-weight:900;padding:3px;font-size:clamp(10px,1.7vh,16px)}.c{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:3px;cursor:pointer;overflow:hidden}.yellow{background:var(--y);border-color:var(--yb)}.blue{background:var(--b);border-color:var(--bb)}.red{background:var(--r);border-color:var(--rb)}.green{background:var(--g);border-color:var(--gb)}.purple{background:var(--p);border-color:var(--pb)}.txt{z-index:2;line-height:1.05}.es{font-weight:900;color:#000;font-size:clamp(11px,2.1vh,20px)}.en{font-weight:700;color:#666;font-size:clamp(7px,1.25vh,12px);margin-top:3px}.small .es{font-size:clamp(9px,1.65vh,16px)}.small .en{font-size:clamp(6px,1.05vh,10px)}.free .es{font-size:clamp(18px,3.5vh,32px)}.ctrl{text-align:center;margin-top:4px}button{border:0;border-radius:9px;background:#ffd84a;padding:5px 17px;font-weight:900;font-size:clamp(11px,1.7vh,16px)}.bubble{position:absolute;z-index:4;width:82%;aspect-ratio:1;border-radius:50%;pointer-events:none;
background:
radial-gradient(circle at 29% 23%,rgba(255,255,255,.92) 0 2.4%,rgba(255,255,255,.35) 3.4%,transparent 8%),
radial-gradient(ellipse at 73% 73%,rgba(90,220,255,.18) 0 10%,transparent 42%),
radial-gradient(ellipse at 22% 74%,rgba(255,95,225,.16) 0 8%,transparent 38%),
radial-gradient(ellipse at 77% 28%,rgba(255,235,90,.13) 0 7%,transparent 34%),
radial-gradient(circle at 50% 50%,rgba(255,255,255,.025) 0 55%,rgba(255,255,255,.24) 66%,rgba(125,220,255,.20) 73%,rgba(255,125,225,.17) 80%,rgba(255,245,130,.13) 85%,rgba(255,255,255,.46) 90%,transparent 94%);
box-shadow:inset 4px 5px 11px rgba(255,255,255,.55),inset -5px -4px 12px rgba(90,190,255,.18),0 3px 8px rgba(0,0,0,.12);
animation:bubbleDrift 3.6s ease-in-out infinite alternate,bubbleShimmer 5.2s ease-in-out infinite;
transform-origin:center;will-change:transform,filter}
.bubble:before{content:"";position:absolute;inset:7%;border-radius:50%;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 25%,rgba(125,235,255,.11) 47%,rgba(255,130,225,.12) 66%,transparent 82%);filter:blur(1px);animation:filmFlow 4.8s ease-in-out infinite alternate}
@keyframes bubbleDrift{0%{transform:translate(-2px,2px) rotate(-.7deg) scale(.995)}45%{transform:translate(1px,-2px) rotate(.35deg) scale(1.006)}100%{transform:translate(2px,1px) rotate(.8deg) scale(.998)}}
@keyframes bubbleShimmer{0%,100%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(18deg) brightness(1.035)}}
@keyframes filmFlow{0%{transform:rotate(-4deg) translate(-1px,1px);opacity:.7}100%{transform:rotate(5deg) translate(2px,-2px);opacity:1}}
.bubble.pop{animation:bubbleBurst .31s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes bubbleBurst{0%{opacity:1;transform:scale(1)}22%{opacity:1;transform:scale(1.035)}48%{opacity:.82;transform:scale(1.07)}100%{opacity:0;transform:scale(1.14);filter:blur(.8px)}}.c.win:after{content:"";position:absolute;inset:2px;border-radius:9px;padding:4px;background:linear-gradient(135deg,#555,#fafafa 20%,#888 40%,#fff 52%,#777 70%,#eee 84%,#555);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;z-index:6;pointer-events:none}.ov{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:center;justify-content:center}.ov.show{display:flex}.modal{background:white;border-radius:22px;padding:28px 38px;text-align:center}.msg{font-size:clamp(42px,8vw,82px);font-weight:900;color:#087ee7;margin-bottom:15px}</style></head><body><main class="app"><h1>BINGO • LOS VERBOS</h1><div class="ins">Click a box to mark it. Click again to pop the bubble!</div><div id="board" class="board"></div><div class="ctrl"><button id="new">Generate a new card</button></div></main><div id="ov" class="ov"><div class="modal"><div id="msg" class="msg">BINGO!</div><button id="cont">Continue Playing</button></div></div><script>
const ITEMS=[{"es": "yo", "en": "I", "color": "yellow"}, {"es": "tú", "en": "you (informal)", "color": "yellow"}, {"es": "usted", "en": "you (formal)", "color": "yellow"}, {"es": "él", "en": "he", "color": "yellow"}, {"es": "ella", "en": "she", "color": "yellow"}, {"es": "nosotros", "en": "we (masculine / mixed)", "color": "yellow"}, {"es": "nosotras", "en": "we (feminine)", "color": "yellow"}, {"es": "ustedes", "en": "you all", "color": "yellow"}, {"es": "ellos", "en": "they (masculine / mixed)", "color": "yellow"}, {"es": "ellas", "en": "they (feminine)", "color": "yellow"}, {"es": "yo hablo", "en": "I speak", "color": "yellow"}, {"es": "tú hablas", "en": "you speak", "color": "yellow"}, {"es": "usted habla", "en": "you speak (formal)", "color": "blue"}, {"es": "él habla", "en": "he speaks", "color": "blue"}, {"es": "ella habla", "en": "she speaks", "color": "blue"}, {"es": "nosotros hablamos", "en": "we speak", "color": "blue"}, {"es": "nosotras hablamos", "en": "we speak", "color": "blue"}, {"es": "ustedes hablan", "en": "you all speak", "color": "blue"}, {"es": "ellos hablan", "en": "they speak", "color": "blue"}, {"es": "ellas hablan", "en": "they speak", "color": "blue"}, {"es": "yo me llamo", "en": "my name is / I am called", "color": "blue"}, {"es": "tú te llamas", "en": "your name is / you are called", "color": "blue"}, {"es": "usted se llama", "en": "your name is / you are called (formal)", "color": "blue"}, {"es": "él se llama", "en": "his name is / he is called", "color": "blue"}, {"es": "ella se llama", "en": "her name is / she is called", "color": "red"}, {"es": "nosotros nos llamamos", "en": "our names are / we are called", "color": "red"}, {"es": "nosotras nos llamamos", "en": "our names are / we are called", "color": "red"}, {"es": "ustedes se llaman", "en": "your names are / you all are called", "color": "red"}, {"es": "ellos se llaman", "en": "their names are / they are called", "color": "red"}, {"es": "ellas se llaman", "en": "their names are / they are called", "color": "red"}, {"es": "yo soy", "en": "I am", "color": "red"}, {"es": "tú eres", "en": "you are", "color": "red"}, {"es": "usted es", "en": "you are (formal)", "color": "red"}, {"es": "él es", "en": "he is", "color": "red"}, {"es": "ella es", "en": "she is", "color": "red"}, {"es": "nosotros somos", "en": "we are", "color": "red"}, {"es": "nosotras somos", "en": "we are", "color": "green"}, {"es": "ustedes son", "en": "you all are", "color": "green"}, {"es": "ellos son", "en": "they are", "color": "green"}, {"es": "ellas son", "en": "they are", "color": "green"}, {"es": "yo tengo", "en": "I have", "color": "green"}, {"es": "tú tienes", "en": "you have", "color": "green"}, {"es": "usted tiene", "en": "you have (formal)", "color": "green"}, {"es": "él tiene", "en": "he has", "color": "green"}, {"es": "ella tiene", "en": "she has", "color": "green"}, {"es": "nosotros tenemos", "en": "we have", "color": "green"}, {"es": "nosotras tenemos", "en": "we have", "color": "green"}, {"es": "ustedes tienen", "en": "you all have", "color": "green"}, {"es": "ellos tienen", "en": "they have", "color": "purple"}, {"es": "ellas tienen", "en": "they have", "color": "purple"}, {"es": "yo vivo", "en": "I live", "color": "purple"}, {"es": "tú vives", "en": "you live", "color": "purple"}, {"es": "usted vive", "en": "you live (formal)", "color": "purple"}, {"es": "él vive", "en": "he lives", "color": "purple"}, {"es": "ella vive", "en": "she lives", "color": "purple"}, {"es": "nosotros vivimos", "en": "we live", "color": "purple"}, {"es": "nosotras vivimos", "en": "we live", "color": "purple"}, {"es": "ustedes viven", "en": "you all live", "color": "purple"}, {"es": "ellos viven", "en": "they live", "color": "purple"}, {"es": "ellas viven", "en": "they live", "color": "purple"}],G=[['AMARILLO','yellow',5],['AZUL','blue',5],['ROJO','red',4],['VERDE','green',5],['MORADO','purple',5]];let announced=new Set();const board=document.getElementById('board'),ov=document.getElementById('ov'),msg=document.getElementById('msg');function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function mk(x){let c=document.createElement('div');c.className='c '+x.color+((x.es.length>18||x.en.length>30)?' small':'');c.dataset.m=0;c.innerHTML=`<div class=txt><div class=es>${x.es}</div><div class=en>${x.en}</div></div>`;c.onclick=()=>mark(c);return c}function free(){let c=document.createElement('div');c.className='c red free';c.dataset.m=0;c.innerHTML='<div class=txt><div class=es>FREE</div></div>';c.onclick=()=>mark(c);return c}function render(){announced=new Set();board.innerHTML='';G.forEach(g=>{let h=document.createElement('div');h.className='h '+g[1];h.textContent=g[0];board.append(h)});let cs=G.map(g=>sh(ITEMS.filter(x=>x.color===g[1])).slice(0,g[2])),ri=0;for(let r=0;r<5;r++)for(let k=0;k<5;k++)board.append(r===2&&k===2?free():mk(cs[k][k===2?ri++:r]))}function cells(){return[...board.querySelectorAll('.c')]}function mark(c,e){let b=c.querySelector('.bubble');if(b){
const cr=c.getBoundingClientRect(),br=b.getBoundingClientRect();
const x=(e&&e.clientX?e.clientX:br.left+br.width/2)-cr.left,y=(e&&e.clientY?e.clientY:br.top+br.height/2)-cr.top;
const wave=document.createElement('i');wave.style.cssText=`position:absolute;z-index:8;left:${x-5}px;top:${y-5}px;width:10px;height:10px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;transition:all .27s ease-out`;c.append(wave);
requestAnimationFrame(()=>{wave.style.width='64px';wave.style.height='64px';wave.style.left=(x-32)+'px';wave.style.top=(y-32)+'px';wave.style.opacity='0'});
for(let i=0;i<8;i++){const f=document.createElement('i'),a=Math.random()*Math.PI*2,d=18+Math.random()*35;f.style.cssText=`position:absolute;z-index:8;left:${x}px;top:${y}px;width:${5+Math.random()*8}px;height:${2+Math.random()*3}px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),rgba(120,225,255,.35),transparent);pointer-events:none;transition:all .29s cubic-bezier(.2,.7,.2,1)`;c.append(f);requestAnimationFrame(()=>{f.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*180}deg) scale(.45)`;f.style.opacity='0'});setTimeout(()=>f.remove(),310)}
b.classList.add('pop');setTimeout(()=>{wave.remove();b.remove();c.dataset.m=0},310);return}
b=document.createElement('div');b.className='bubble';c.append(b);c.dataset.m=1;setTimeout(check,20)}function lines(){let L=[];for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c));L.push([0,6,12,18,24],[4,8,12,16,20]);return L}function check(){let z=cells(),fresh=[];lines().forEach((L,i)=>{if(L.every(k=>z[k].dataset.m==='1')&&!announced.has(i)){announced.add(i);fresh.push(L);L.forEach(k=>z[k].classList.add('win'))}});if(fresh.length){msg.textContent=fresh.length>1?'DOUBLE BINGO!':'BINGO!';ov.classList.add('show')}}document.getElementById('cont').onclick=()=>ov.classList.remove('show');document.getElementById('new').onclick=render;render()</script></body></html>
