<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>¿Quién empieza? — Clase Azul</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1f6;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;color:#102b4e}.app{width:min(1100px,96vw);aspect-ratio:4/3;background:white;border:7px solid #102b4e;border-radius:28px;position:relative;overflow:hidden;box-shadow:0 15px 40px #0002}header{text-align:center;padding:28px 100px 5px}h1{font-size:58px;margin:0;line-height:.95}.sub{color:#8b94a1;font-size:20px;font-weight:bold;margin-top:7px}.badge{position:absolute;right:25px;top:22px;width:82px;height:82px;border-radius:50%;background:#2f80ed;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;font-weight:900;box-shadow:0 6px #1f5fae}.badge small{font-size:10px}.history{position:absolute;left:28px;top:185px;width:185px;background:#f6f8fb;border:2px solid #e2e7ee;border-radius:18px;padding:12px;max-height:430px}.history h2{text-align:center;font-size:14px;margin:0 0 8px}.history small{color:#8b94a1}.list{display:flex;flex-direction:column;gap:5px;max-height:360px;overflow:auto}.item{display:grid;grid-template-columns:30px 1fr;align-items:center;gap:7px;background:white;border-radius:10px;padding:5px;font-size:12px;font-weight:bold}.mini{width:29px;height:29px;border-radius:50%;background:#2f80ed;color:white;display:grid;place-items:center}.empty{text-align:center;color:#999;font-size:12px;padding:8px}.center{margin-left:0;height:570px;display:flex;flex-direction:column;align-items:center;justify-content:center}.pick{border:0;border-radius:21px;background:#ffd84d;color:#102b4e;font-size:25px;font-weight:900;padding:17px 30px;box-shadow:0 7px #c8a51d;cursor:pointer}.pick:disabled{opacity:.55}.result{display:flex;align-items:center;gap:45px;min-height:315px}.student{text-align:center;min-width:260px}.num{margin:auto;width:140px;height:140px;border-radius:50%;background:#2f80ed;border:8px solid #ffd84d;color:white;display:grid;place-items:center;font-size:80px;font-weight:900;box-shadow:0 8px #1f5fae}.name{color:#2f80ed;font-size:48px;font-weight:900;margin-top:15px}.direction{text-align:center;min-width:245px;background:#f5f7fa;border:3px solid #e4e9ef;border-radius:24px;padding:22px}.arrow{font-size:86px;font-weight:900;line-height:.9;color:#2f80ed;text-shadow:0 4px 0 #cfe2ff}.es{font-size:32px;font-weight:900;margin-top:10px}.en{font-size:18px;color:#8b94a1;font-weight:bold}.turn{font-size:21px;font-weight:900}.turn small{font-size:14px;color:#8b94a1}.controls{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);display:flex;gap:12px}.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:900;cursor:pointer}.new{display:none;background:#102b4e;color:white}.reset{background:#e7ebf1;color:#102b4e}.done{display:none;font-weight:900;margin-top:8px}.conf{position:absolute;width:9px;height:15px;animation:f 1.3s forwards}@keyframes f{to{transform:translate(var(--x),var(--y)) rotate(600deg);opacity:0}}</style></head>
<body><div class="app" id="app"><header><h1>¿QUIÉN EMPIEZA?</h1><div class="sub">WHO STARTS?</div></header><div class="badge">16<small>estudiantes</small></div><main class="center"><button class="pick" id="pick">🎲 ¡ELIGE UN ESTUDIANTE!</button><div class="result"><div class="student"><div class="num" id="num">?</div><div class="name" id="name">—</div></div><div class="direction"><div class="arrow" id="arrow">↔</div><div class="es" id="es">¿?</div><div class="en" id="en">Left or right?</div></div></div><div class="turn" id="turn" style="visibility:hidden">¡Empiezas tú! <small>/ You start!</small></div><div class="done" id="done">🎉 ¡Todos participaron!</div></main><div class="controls"><button class="btn new" id="new">🔄 NUEVA RONDA</button><button class="btn reset" id="reset">↺ Reiniciar</button></div></div>
<script>const students=[{n:1,name:'Mason'},{n:2,name:'Gabby'},{n:3,name:'Audrey'},{n:4,name:'Mila'},{n:5,name:'Anthony'},{n:6,name:'Sistine'},{n:7,name:'Maximus'},{n:8,name:'Victoria L.'},{n:9,name:'Rose'},{n:10,name:'Emmett'},{n:11,name:'Victoria P.'},{n:12,name:'Tyler'},{n:13,name:'Nyle'},{n:14,name:'Matthew'},{n:15,name:'Graydon'},{n:16,name:'Jasper'}];let pool=[],used=[],busy=false;const $=x=>document.getElementById(x);function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){pool=sh(students);used=[];$('num').textContent='?';$('name').textContent='—';$('arrow').textContent='↔';$('es').textContent='¿?';$('en').textContent='Left or right?';$('turn').style.visibility='hidden';$('done').style.display='none';$('new').style.display='none';$('pick').disabled=false}function hist(){}function conf(){for(let i=0;i<45;i++){let c=document.createElement('i');c.className='conf';c.style.background=['#2f80ed','#ffd84d','#2f80ed','#22a663'][i%4];c.style.left='58%';c.style.top='48%';c.style.setProperty('--x',(Math.random()*600-300)+'px');c.style.setProperty('--y',(Math.random()*350-50)+'px');$('app').appendChild(c);setTimeout(()=>c.remove(),1400)}}$('pick').onclick=()=>{if(busy||!pool.length)return;busy=true;$('pick').disabled=true;$('turn').style.visibility='hidden';let st=performance.now(),t=setInterval(()=>{let s=pool[Math.floor(Math.random()*pool.length)],d=Math.random()<.5;$('num').textContent=s.n;$('name').textContent=s.name;$('arrow').textContent=d?'←':'→';$('es').textContent=d?'IZQUIERDA':'DERECHA';$('en').textContent=d?'LEFT':'RIGHT';if(performance.now()-st>2200){clearInterval(t);let s=pool.pop(),d=Math.random()<.5;$('num').textContent=s.n;$('name').textContent=s.name;$('arrow').textContent=d?'←':'→';$('es').textContent=d?'IZQUIERDA':'DERECHA';$('en').textContent=d?'LEFT':'RIGHT';used.push(s);hist();conf();$('turn').style.visibility='visible';busy=false;if(pool.length)$('pick').disabled=false;else{$('done').style.display='block';$('new').style.display='block'}}},75)};$('new').onclick=start;$('reset').onclick=start;start();</script></body></html>
