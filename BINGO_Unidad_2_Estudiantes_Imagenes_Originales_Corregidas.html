nt.getElementById('msg');function sh(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function mk(x){let c=document.createElement('div');c.className='c '+x.color+((x.es.length>18||x.en.length>30)?' small':'');c.dataset.m=0;c.innerHTML=`<div class=txt>${x.img?`<img class="pic" src="${x.img}" alt="" draggable="false">`:""}<div class=es>${x.es}</div><div class=en>${x.en}</div></div>`;c.onclick=e=>mark(c,e);return c}function free(){let c=document.createElement('div');c.className='c red free';c.dataset.m=0;c.innerHTML='<div class=txt><div class=es>FREE</div></div>';c.onclick=e=>mark(c,e);return c}function render(){announced=new Set();board.innerHTML='';G.forEach(g=>{let h=document.createElement('div');h.className='h '+g[1];h.textContent=g[0];board.append(h)});let cs=G.map(g=>sh(ITEMS.filter(x=>x.color===g[1])).slice(0,g[2])),ri=0;for(let r=0;r<5;r++)for(let k=0;k<5;k++)board.append(r===2&&k===2?free():mk(cs[k][k===2?ri++:r]))}function cells(){return[...board.querySelectorAll('.c')]}function mark(c,e){let b=c.querySelector('.bubble');if(b){

const wave=document.createElement('i');wave.style.cssText=`position:absolute;z-index:8;left:${x-5}px;top:${y-5}px;width:10px;height:10px;border:1.5px solid rgba(255,255,255,.9);border-radius:50%;pointer-events:none;transition:all .27s ease-out`;c.append(wave);
requestAnimationFrame(()=>{wave.style.width='64px';wave.style.height='64px';wave.style.left=(x-32)+'px';wave.style.top=(y-32)+'px';wave.style.opacity='0'});
for(let i=0;i<8;i++){const f=document.createElement('i'),a=Math.random()*Math.PI*2,d=18+Math.random()*35;f.style.cssText=`position:absolute;z-index:8;left:${x}px;top:${y}px;width:${5+Math.random()*8}px;height:${2+Math.random()*3}px;border-radius:50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),rgba(120,225,255,.35),transparent);pointer-events:none;transition:all .29s cubic-bezier(.2,.7,.2,1)`;c.append(f);requestAnimationFrame(()=>{f.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*180}deg) scale(.45)`;f.style.opacity='0'});setTimeout(()=>f.remove(),310)}
b.classList.add('pop');setTimeout(()=>{wave.remove();b.remove();c.dataset.m=0},310);return}
b=document.createElement('div');b.className='bubble';c.append(b);c.dataset.m=1;setTimeout(check,20)}function lines(){let L=[];for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c));for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c));L.push([0,6,12,18,24],[4,8,12,16,20]);return L}function check(){let z=cells(),fresh=[];lines().forEach((L,i)=>{if(L.every(k=>z[k].dataset.m==='1')&&!announced.has(i)){announced.add(i);fresh.push(L);L.forEach(k=>z[k].classList.add('win'))}});if(fresh.length){msg.textContent=fresh.length>1?'DOUBLE BINGO!':'BINGO!';ov.classList.add('show')}}document.getElementById('cont').onclick=()=>ov.classList.remove('show');document.getElementById('new').onclick=render;render()</script></body></html>
