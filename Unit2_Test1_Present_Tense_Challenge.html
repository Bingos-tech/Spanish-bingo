<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Present Tense Challenge | Unit 2 Test Day 1</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,#263c75,#0c1530 58%,#080e20);color:#f6f8ff;font-family:system-ui,-apple-system,Arial,sans-serif;min-height:100vh}main{max-width:1080px;margin:auto;padding:24px 18px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{color:#91d9ff;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,49px);margin:10px 0 5px;line-height:1.1}.sub{color:#b7c7e7;margin:0 0 20px}.panel{background:#15264c;border:1px solid #39558b;border-radius:22px;padding:22px;box-shadow:0 15px 40px #0004}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:#223762;padding:9px 15px;border-radius:14px;font-weight:800}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#6be7c5;color:#08192d;padding:12px 18px;font-weight:850;transition:transform .1s,filter .15s}button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.43;cursor:not-allowed}.secondary{background:#344c7d;color:white}.danger{background:#ffbb69;color:#20172a}.option{background:#293e70;color:#fff;border:2px solid #5069a0;min-height:58px}.option.correct{background:#167f61;border-color:#76ffd6}.option.wrong{background:#9c3650;border-color:#ff9caf}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prompt{font-size:clamp(23px,3.4vw,34px);font-weight:850;margin:16px 0}.hint{color:#b9c9e9}.feedback{min-height:32px;font-size:19px;font-weight:800;margin:14px 0}.good{color:#80ffd5}.bad{color:#ffb3b3}.tile{background:#2d467e;color:white;border:2px solid #6983b8;font-size:20px}.answer{min-height:60px;background:#0c1936;border:2px dashed #7790bf;border-radius:14px;padding:16px;font-size:23px;font-weight:800;margin:15px 0}.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.center{text-align:center}.art{font-size:clamp(54px,9vw,100px);line-height:1.3}.cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.memory{min-height:105px;padding:10px 5px;background:#293d72;color:white;border:2px solid #506eab;font-size:clamp(13px,1.7vw,18px);overflow-wrap:anywhere}.memory.open{background:#fff;color:#11224c}.memory.matched{background:#175e54;color:#e8fff8;border-color:#62e3bb}.memory .back{font-size:32px}.small{font-size:13px;color:#bdd0ed}footer{margin-top:25px;color:#8ca2c9;font-size:13px}label{font-weight:800}select,input{border:1px solid #8198c8;border-radius:10px;padding:11px;background:#f6f9ff;color:#142244}input{width:100%;max-width:480px}.pill{border-radius:999px;background:#3c3577;color:#e8dbff;padding:7px 12px;font-weight:800}.hidden{display:none!important}@media(max-width:650px){.cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.choices{grid-template-columns:1fr}.memory{min-height:90px}main{padding:16px 12px}.panel{padding:16px}}</style></head><body><main><header><div class="eyebrow">UNIT 2 · TEST REVIEW #1 · VOCABULARY & GRAMMAR</div><span class="pill">Offline • No login</span></header><h1>Present Tense Challenge</h1><p class="sub">Practice -AR, -ER, -IR and llamarse with all six subject groups.</p><div id="stats" class="stats"></div><section class="panel"><div id="game"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div></section><footer>Study practice for Unit 2, Test Day 1. Your answers stay on this device. No accounts, tracking, or external resources.</footer></main><script>const $=s=>document.querySelector(s), rnd=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let score=0,round=0,total=0,locked=false;function stats(){ $('#stats').innerHTML=`<span class="stat">⭐ Score: ${score}</span><span class="stat">🎯 Round: ${Math.min(round+1,total)} / ${total}</span>`}function msg(t,ok){$('#feedback').textContent=t;$('#feedback').className='feedback '+(ok?'good':'bad')}function finish(){locked=true;$('#game').innerHTML=`<div class="center"><div class="art">🏆</div><h2>Great practice!</h2><p class="prompt">${score} / ${total} correct</p><p>Play again to strengthen your Spanish before Test Day 1.</p><button onclick="start()">Play again ↻</button></div>`;$('#feedback').textContent='';stats()}function options(correct,wrong,cb){let all=shuffle([correct,...shuffle(wrong.filter(x=>x!==correct)).slice(0,3)]);$('#choices').innerHTML=all.map((x,i)=>`<button class="option" data-i="${i}">${esc(x)}</button>`).join('');[...$('#choices').children].forEach((b,i)=>b.onclick=()=>{if(locked)return;locked=true;let ok=all[i]===correct;if(ok){score++;b.classList.add('correct');msg('✓ Correct!',true)}else{b.classList.add('wrong');[...$('#choices').children].find(q=>q.textContent===correct)?.classList.add('correct');msg('Not quite. Correct answer: '+correct,false)}stats();$('#next').classList.remove('hidden');cb?.(ok)})}function advance(){round++;locked=false;msg('',true);$('#next')?.classList.add('hidden');if(round>=total)finish();else render();stats()}
const verbs={"estudiar": ["estudio", "estudias", "estudia", "estudiamos", "estudiáis", "estudian"], "beber": ["bebo", "bebes", "bebe", "bebemos", "bebéis", "beben"], "escribir": ["escribo", "escribes", "escribe", "escribimos", "escribís", "escriben"], "llamarse": ["me llamo", "te llamas", "se llama", "nos llamamos", "os llamáis", "se llaman"], "leer": ["leo", "lees", "lee", "leemos", "leéis", "leen"], "aprender": ["aprendo", "aprendes", "aprende", "aprendemos", "aprendéis", "aprenden"], "vivir": ["vivo", "vives", "vive", "vivimos", "vivís", "viven"]},subjects=["yo", "tú", "él / ella / usted", "nosotros/as", "vosotros/as", "ellos / ellas / ustedes"];let bank=[],current;function start(){let count=+($('#count')?.value||20);bank=shuffle(Object.entries(verbs).flatMap(([verb,forms])=>forms.map((answer,i)=>({verb,subject:subjects[i],answer})))).slice(0,count);score=round=0;total=bank.length;$('#game').innerHTML=`<div class="controls"><label>Questions <select id="count"><option>10</option><option selected>20</option><option>30</option><option>42</option></select></label><button class="secondary" onclick="start()">Restart ↻</button></div><div id="task"></div><div id="choices" class="choices"></div><button id="next" class="secondary hidden" onclick="advance()">Next →</button>`;$('#count').value=count;render();stats()}function render(){current=bank[round];locked=false;$('#task').innerHTML=`<p class="hint">Choose the correct present-tense form.</p><div class="prompt">${esc(current.subject)} + <span style="color:#83ffe0">${esc(current.verb)}</span></div>`;let forms=verbs[current.verb];let wrong=shuffle(forms.filter(x=>x!==current.answer));let others=shuffle(Object.values(verbs).flatMap(x=>x)).filter(x=>x!==current.answer&&!wrong.includes(x));options(current.answer,[...wrong,...others]);$('#next').classList.add('hidden')}start();</script></body></html>
