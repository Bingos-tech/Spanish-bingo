<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gustar Sentence Builder | Unit 2 Test Day 1</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,#263c75,#0c1530 58%,#080e20);color:#f6f8ff;font-family:system-ui,-apple-system,Arial,sans-serif;min-height:100vh}main{max-width:1080px;margin:auto;padding:24px 18px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{color:#91d9ff;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,49px);margin:10px 0 5px;line-height:1.1}.sub{color:#b7c7e7;margin:0 0 20px}.panel{background:#15264c;border:1px solid #39558b;border-radius:22px;padding:22px;box-shadow:0 15px 40px #0004}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:#223762;padding:9px 15px;border-radius:14px;font-weight:800}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#6be7c5;color:#08192d;padding:12px 18px;font-weight:850;transition:transform .1s,filter .15s}button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.43;cursor:not-allowed}.secondary{background:#344c7d;color:white}.danger{background:#ffbb69;color:#20172a}.option{background:#293e70;color:#fff;border:2px solid #5069a0;min-height:58px}.option.correct{background:#167f61;border-color:#76ffd6}.option.wrong{background:#9c3650;border-color:#ff9caf}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prompt{font-size:clamp(23px,3.4vw,34px);font-weight:850;margin:16px 0}.hint{color:#b9c9e9}.feedback{min-height:32px;font-size:19px;font-weight:800;margin:14px 0}.good{color:#80ffd5}.bad{color:#ffb3b3}.tile{background:#2d467e;color:white;border:2px solid #6983b8;font-size:20px}.answer{min-height:60px;background:#0c1936;border:2px dashed #7790bf;border-radius:14px;padding:16px;font-size:23px;font-weight:800;margin:15px 0}.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.center{text-align:center}.art{font-size:clamp(54px,9vw,100px);line-height:1.3}.cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.memory{min-height:105px;padding:10px 5px;background:#293d72;color:white;border:2px solid #506eab;font-size:clamp(13px,1.7vw,18px);overflow-wrap:anywhere}.memory.open{background:#fff;color:#11224c}.memory.matched{background:#175e54;color:#e8fff8;border-color:#62e3bb}.memory .back{font-size:32px}.small{font-size:13px;color:#bdd0ed}footer{margin-top:25px;color:#8ca2c9;font-size:13px}label{font-weight:800}select,input{border:1px solid #8198c8;border-radius:10px;padding:11px;background:#f6f9ff;color:#142244}input{width:100%;max-width:480px}.pill{border-radius:999px;background:#3c3577;color:#e8dbff;padding:7px 12px;font-weight:800}.hidden{display:none!important}@media(max-width:650px){.cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.choices{grid-template-columns:1fr}.memory{min-height:90px}main{padding:16px 12px}.panel{padding:16px}}</style></head><body><main><header><div class="eyebrow">UNIT 2 · TEST REVIEW #1 · VOCABULARY & GRAMMAR</div><span class="pill">Offline • No login</span></header><h1>Gustar Sentence Builder</h1><p class="sub">Build complete sentences and practice agreement / disagreement.</p><div id="stats" class="stats"></div><section class="panel"><div id="game"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div></section><footer>Study practice for Unit 2, Test Day 1. Your answers stay on this device. No accounts, tracking, or external resources.</footer></main><script>const $=s=>document.querySelector(s), rnd=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let score=0,round=0,total=0,locked=false;function stats(){ $('#stats').innerHTML=`<span class="stat">⭐ Score: ${score}</span><span class="stat">🎯 Round: ${Math.min(round+1,total)} / ${total}</span>`}function msg(t,ok){$('#feedback').textContent=t;$('#feedback').className='feedback '+(ok?'good':'bad')}function finish(){locked=true;$('#game').innerHTML=`<div class="center"><div class="art">🏆</div><h2>Great practice!</h2><p class="prompt">${score} / ${total} correct</p><p>Play again to strengthen your Spanish before Test Day 1.</p><button onclick="start()">Play again ↻</button></div>`;$('#feedback').textContent='';stats()}function options(correct,wrong,cb){let all=shuffle([correct,...shuffle(wrong.filter(x=>x!==correct)).slice(0,3)]);$('#choices').innerHTML=all.map((x,i)=>`<button class="option" data-i="${i}">${esc(x)}</button>`).join('');[...$('#choices').children].forEach((b,i)=>b.onclick=()=>{if(locked)return;locked=true;let ok=all[i]===correct;if(ok){score++;b.classList.add('correct');msg('✓ Correct!',true)}else{b.classList.add('wrong');[...$('#choices').children].find(q=>q.textContent===correct)?.classList.add('correct');msg('Not quite. Correct answer: '+correct,false)}stats();$('#next').classList.remove('hidden');cb?.(ok)})}function advance(){round++;locked=false;msg('',true);$('#next')?.classList.add('hidden');if(round>=total)finish();else render();stats()}
const sentences=[["yo + gustar + la música", "A mí me gusta la música.", ["A mí", "me", "gusta", "la música."]], ["nosotros + gustar mucho + leer novelas", "A nosotros nos gusta mucho leer novelas.", ["A nosotros", "nos", "gusta mucho", "leer novelas."]], ["Lucía y Diego + no gustar + el queso", "A Lucía y Diego no les gusta el queso.", ["A Lucía y Diego", "no", "les", "gusta", "el queso."]], ["ustedes + gustar + los caballos", "A ustedes les gustan los caballos.", ["A ustedes", "les", "gustan", "los caballos."]], ["Teresa + no gustar nada + las albóndigas", "A Teresa no le gustan nada las albóndigas.", ["A Teresa", "no", "le", "gustan nada", "las albóndigas."]], ["tú + gustar mucho + la tortilla de patatas", "A ti te gusta mucho la tortilla de patatas.", ["A ti", "te", "gusta mucho", "la tortilla de patatas."]], ["vosotros + no gustar + nadar", "A vosotros no os gusta nadar.", ["A vosotros", "no", "os", "gusta", "nadar."]], ["Sofía + no gustar nada + cantar", "A Sofía no le gusta nada cantar.", ["A Sofía", "no", "le", "gusta nada", "cantar."]], ["Ana y Leo + gustar + los gatos", "A Ana y Leo les gustan los gatos.", ["A Ana y Leo", "les", "gustan", "los gatos."]], ["yo + no gustar + el pescado", "A mí no me gusta el pescado.", ["A mí", "no", "me", "gusta", "el pescado."]], ["él + gustar + el arroz", "A él le gusta el arroz.", ["A él", "le", "gusta", "el arroz."]], ["vosotros + gustar + las frutas", "A vosotros os gustan las frutas.", ["A vosotros", "os", "gustan", "las frutas."]]],reactions=[["Me gusta el gazpacho. You disagree.", "A mí no."], ["No me gusta el queso. You agree.", "A mí tampoco."], ["Me gusta el arroz. You agree.", "A mí también."], ["No me gusta el pescado. You disagree.", "A mí sí."]];let bank=[],current,tokens=[],chosen=[];function start(){bank=shuffle(sentences.map(x=>({type:'build',clue:x[0],answer:x[1],parts:x[2]})).concat(reactions.map(x=>({type:'react',clue:x[0],answer:x[1]}))));score=round=0;total=bank.length;$('#game').innerHTML=`<p class="hint">Build complete sentences using A + person, pronouns, gusta/gustan, and negation. Reaction rounds use multiple choice.</p><div id="task"></div><div id="choices" class="choices"></div><button id="next" class="secondary hidden" onclick="advance()">Next →</button>`;render();stats()}function render(){current=bank[round];locked=false;chosen=[];$('#next').classList.add('hidden');$('#choices').innerHTML='';if(current.type==='react'){$('#task').innerHTML=`<div class="pill" style="display:inline-block">Reaction round</div><p class="prompt">${esc(current.clue)}</p>`;options(current.answer,reactions.map(x=>x[1]))}else{tokens=shuffle(current.parts);$('#task').innerHTML=`<div class="pill" style="display:inline-block">Build the sentence</div><p class="hint">Clues:</p><div class="prompt">${esc(current.clue)}</div><div id="answer" class="answer">Tap the blocks in order</div><div class="chips" id="tiles"></div><div class="controls"><button class="secondary" id="undo">Undo ↶</button><button id="check">Check sentence ✓</button></div>`;$('#tiles').innerHTML=tokens.map((x,i)=>`<button class="tile" data-i="${i}">${esc(x)}</button>`).join('');[...$('#tiles').children].forEach(b=>b.onclick=()=>{if(locked)return;chosen.push(+b.dataset.i);b.disabled=true;update()});$('#undo').onclick=()=>{if(locked)return;chosen.pop();[...$('#tiles').children].forEach(b=>b.disabled=chosen.includes(+b.dataset.i));update()};$('#check').onclick=()=>{if(locked)return;locked=true;let answer=chosen.map(i=>tokens[i]).join(' ');if(answer===current.answer){score++;msg('✓ Correct!',true)}else msg('Correct sentence: '+current.answer,false);$('#next').classList.remove('hidden');stats()}}}function update(){$('#answer').textContent=chosen.length?chosen.map(i=>tokens[i]).join(' '):'Tap the blocks in order'}start();</script></body></html>
