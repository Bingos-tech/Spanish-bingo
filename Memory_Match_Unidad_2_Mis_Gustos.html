<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match · Unit 2</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#edf7ff;background:#07152e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#173c76,#07152e 70%);min-height:100vh}.app{max-width:1060px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{margin:0;font-size:clamp(26px,4vw,43px);letter-spacing:-1px}.accent{color:#62f2fa}.tag{font-size:12px;font-weight:900;letter-spacing:2px;color:#a9c6e8}p{color:#c6d9ef;margin:7px 0 15px}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 16px}.stat{background:#122d58;border:1px solid #2b5d95;border-radius:13px;padding:10px 15px;font-weight:800}.stat b{color:#66f4fb}button{cursor:pointer;font:inherit}.action{border:0;background:#ffda49;color:#14203b;padding:12px 18px;border-radius:12px;font-weight:950;box-shadow:0 4px 0 #9a6b17}.action:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6b17}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile{height:112px;position:relative;perspective:700px;border:0;padding:0;background:transparent;border-radius:15px}.inner{position:absolute;inset:0;transition:transform .42s;transform-style:preserve-3d}.tile.open .inner,.tile.matched .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:15px;display:flex;justify-content:center;align-items:center;text-align:center;padding:9px}.back{background:linear-gradient(135deg,#214da1,#4a20b4);border:2px solid #5fdffb;box-shadow:inset 0 0 22px #3df2ff20,0 4px 14px #0004;color:#baf8ff;font-size:37px;font-weight:900}.front{transform:rotateY(180deg);background:#f4fbff;border:3px solid #75dcff;color:#10254a;font-size:clamp(15px,2.1vw,23px);font-weight:900;line-height:1.2}.tile.matched .front{background:#d7fff2;border-color:#29cda4;color:#08624d}.tile:focus-visible{outline:3px solid #ffda49;outline-offset:3px}.message{margin:15px 0 0;min-height:29px;font-weight:850;text-align:center;color:#fce58b}.footer{color:#a8c3e5;text-align:center;font-size:12px;margin-top:13px}@media(min-width:900px){.board{grid-template-columns:repeat(6,minmax(0,1fr))}.tile{height:120px}}@media(max-width:530px){.app{padding:10px}.board{gap:7px}.tile{height:89px}.front{font-size:13px}.back{font-size:27px}.stat{padding:8px 10px}}
</style></head><body><main class="app"><header><div><div class="tag">SPANISH · UNIT 2 · MIS GUSTOS</div><h1>🧠 <span class="accent">MEMORY</span> MATCH</h1></div><button class="action" id="reset">↻ NEW GAME</button></header><p>Flip two cards. Match each Spanish free-time activity with its English meaning. Find all 12 pairs!</p><div class="bar"><div class="stat">MATCHES <b id="matches">0 / 12</b></div><div class="stat">MOVES <b id="moves">0</b></div><div class="stat">TIME <b id="time">0:00</b></div><div class="stat">BEST MOVES <b id="best">—</b></div></div><section class="board" id="board" aria-label="Memory matching cards"></section><div class="message" id="message" aria-live="polite">Choose two cards to begin!</div><div class="footer">Practice vocabulary from Unit 2 · Reporteros Internacionales 1 · Works offline</div></main><script>
const pairs=[['escuchar música','to listen to music'],['tocar la guitarra','to play the guitar'],['tocar el saxo','to play the saxophone'],['leer cómics','to read comics'],['escribir poesía','to write poetry'],['estudiar español','to study Spanish'],['estudiar inglés','to study English'],['chatear','to chat online'],['dibujar','to draw'],['jugar al fútbol','to play soccer'],['comer chocolate','to eat chocolate'],['beber refrescos','to drink soft drinks']];
const $=id=>document.getElementById(id);let deck=[],opened=[],matched=0,moves=0,locked=false,started=0,clock=null,turnTimer=null,gameId=0;const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function tick(){let n=Math.floor((Date.now()-started)/1000);$('time').textContent=Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function reset(){gameId++;clearTimeout(turnTimer);clearInterval(clock);clock=null;started=0;deck=shuffle(pairs.flatMap((pair,id)=>[{id,label:pair[0]},{id,label:pair[1]}]));opened=[];matched=0;moves=0;locked=false;$('matches').textContent='0 / 12';$('moves').textContent='0';$('time').textContent='0:00';$('message').textContent='Choose two cards to begin!';$('board').replaceChildren();deck.forEach((item,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='tile';btn.setAttribute('aria-label','Hidden card '+(i+1));btn.innerHTML='<span class="inner"><span class="face back">?</span><span class="face front"></span></span>';btn.querySelector('.front').textContent=item.label;btn.addEventListener('click',()=>flip(i));$('board').append(btn)});try{$('best').textContent=localStorage.getItem('u2-memory-best')||'—'}catch(e){$('best').textContent='—'}}function flip(i){if(locked||opened.includes(i))return;const btn=$('board').children[i];if(btn.classList.contains('matched'))return;if(!started){started=Date.now();clock=setInterval(tick,500)}btn.classList.add('open');btn.setAttribute('aria-label',deck[i].label);opened.push(i);if(opened.length!==2)return;moves++;$('moves').textContent=moves;let [a,b]=opened;if(deck[a].id===deck[b].id){for(let idx of opened)$('board').children[idx].classList.add('matched');matched++;$('matches').textContent=matched+' / 12';opened=[];$('message').textContent='✓ Great match!';if(matched===12){clearInterval(clock);tick();$('message').textContent='🎉 Excellent! All 12 pairs matched in '+moves+' moves!';try{const old=Number(localStorage.getItem('u2-memory-best'));if(!old||moves<old){localStorage.setItem('u2-memory-best',String(moves));$('best').textContent=moves}}catch(e){}}}else{locked=true;$('message').textContent='Try again!';const id=gameId;turnTimer=setTimeout(()=>{if(id!==gameId)return;for(let idx of opened){const el=$('board').children[idx];el.classList.remove('open');el.setAttribute('aria-label','Hidden card '+(idx+1))}opened=[];locked=false},1000)}}$('reset').addEventListener('click',reset);reset();
</script></body></html>
