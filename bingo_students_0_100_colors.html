<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spanish Numbers Bingo</title>
<style>
:root{
  --yellow:#fff36a; --yellow-b:#d9c900;
  --blue:#8fd3ff; --blue-b:#318dc7;
  --red:#ff987f; --red-b:#cf5c45;
  --green:#8ddd72; --green-b:#45a13f;
  --purple:#c9b5f7; --purple-b:#846cc3;
}
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
}
.wrap{max-width:1180px;margin:0 auto;text-align:center}
h1{
  margin:0;
  font-size:clamp(58px,8vw,108px);
  line-height:.95;
  color:#087ee7;
  -webkit-text-fill-color:#087ee7;
  -webkit-text-stroke:3px #000;
  paint-order:stroke fill;
  letter-spacing:2px;
  font-weight:1000;
  text-shadow:none;
}
.instructions{
  margin:12px 0 18px;
  font-size:clamp(18px,2.6vw,32px);
  font-weight:700;
}
.board{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
  width:100%;
}
.header,.cell{
  border:3px solid #111;
  border-radius:10px;
  min-width:0;
}
.header{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:6px;
  font-size:clamp(16px,2.2vw,29px);
  font-weight:900;
}
.cell{
  height:145px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  isolation:isolate;
}
.cell:focus-visible{outline:5px solid #111;outline-offset:2px}
.number{
  position:relative;
  z-index:2;
  color:#000;
  font-size:clamp(42px,6vw,76px);
  font-weight:950;
  line-height:.9;
}
.word{
  position:relative;
  z-index:2;
  color:#000;
  margin-top:9px;
  padding:0 5px;
  width:100%;
  font-size:clamp(14px,1.8vw,25px);
  line-height:1.05;
  font-weight:800;
  overflow-wrap:anywhere;
}
.yellow{background:var(--yellow);border-color:var(--yellow-b)}
.blue{background:var(--blue);border-color:var(--blue-b)}
.red{background:var(--red);border-color:var(--red-b)}
.green{background:var(--green);border-color:var(--green-b)}
.purple{background:var(--purple);border-color:var(--purple-b)}
.header.yellow,.header.blue,.header.red,.header.green,.header.purple{border-color:#111}

.free{
  cursor:pointer;
}
.free .word{
  font-size:clamp(22px,3vw,34px);
  margin-top:0;
  color:#000;
}

.bubble{
  position:absolute;
  left:50%;
  top:50%;
  width:min(112px,78%);
  aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  z-index:4;
  pointer-events:none;
  opacity:.93;
  border:2px solid rgba(255,255,255,.85);
  background:
    radial-gradient(circle at 28% 20%, rgba(255,255,255,.95) 0 5%, rgba(255,255,255,.45) 6% 10%, transparent 21%),
    radial-gradient(circle at 72% 76%, rgba(255,255,255,.26) 0 7%, transparent 27%),
    conic-gradient(from 20deg,
      rgba(255,75,145,.21),
      rgba(255,217,72,.18),
      rgba(112,255,203,.18),
      rgba(88,185,255,.21),
      rgba(178,111,255,.19),
      rgba(255,75,145,.21));
  box-shadow:
    inset 0 0 13px rgba(255,255,255,.78),
    inset 8px 9px 18px rgba(255,120,185,.08),
    inset -8px -9px 18px rgba(75,115,255,.11),
    0 3px 8px rgba(25,45,80,.17);
  backdrop-filter:blur(.35px) saturate(1.2);
  -webkit-backdrop-filter:blur(.35px) saturate(1.2);
  animation:breathe 4.6s ease-in-out infinite;
}
.bubble::before{
  content:"";
  position:absolute;
  width:26%;
  height:12%;
  left:17%;
  top:14%;
  border-radius:50%;
  background:rgba(255,255,255,.68);
  filter:blur(.4px);
  transform:rotate(-28deg);
}
.bubble::after{
  content:"";
  position:absolute;
  inset:7px;
  border-radius:50%;
  border-top:2px solid rgba(255,255,255,.8);
  border-left:1px solid rgba(255,255,255,.38);
  transform:rotate(-18deg);
}
@keyframes breathe{
  0%{
    transform:translate(-50%,-50%) translate(0,0) scale(1);
  }
  18%{
    transform:translate(-50%,-50%) translate(1.5px,-2px) scale(1.012);
  }
  38%{
    transform:translate(-50%,-50%) translate(-1px,-3px) scale(.996);
  }
  58%{
    transform:translate(-50%,-50%) translate(-2px,-1px) scale(1.009);
  }
  78%{
    transform:translate(-50%,-50%) translate(1px,1px) scale(1.003);
  }
  100%{
    transform:translate(-50%,-50%) translate(0,0) scale(1);
  }
}
to{opacity:0;transform:rotate(-28deg) scale(.35)}
}
28%{
    transform:translate(-50%,-50%) scale(1.07,0.96);
    opacity:.9;
  }
  52%{
    transform:translate(-50%,-50%) scale(1.18,1.05);
    opacity:.62;
    filter:blur(.2px);
  }
  72%{
    transform:translate(-50%,-50%) scale(1.30,0.92);
    opacity:.28;
    filter:blur(.7px);
  }
  100%{
    transform:translate(-50%,-50%) scale(1.42,0.78);
    opacity:0;
    filter:blur(1.4px);
  }
}
45%{
    transform:translate(-50%,-50%) scale(1.02) rotate(7deg);
    opacity:.72;
  }
  100%{
    transform:translate(-50%,-50%) scale(1.34) rotate(14deg);
    opacity:0;
  }
}

.controls{margin:20px 0 4px}
button{
  border:0;
  border-radius:16px;
  padding:14px 28px;
  min-height:52px;
  background:#087ee7;
  color:white;
  font-size:clamp(18px,2vw,26px);
  font-weight:900;
  box-shadow:0 5px 0 #075da9;
  cursor:pointer;
}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #075da9}

@media(max-width:760px){
  body{padding:10px}
  .board{gap:3px}
  .header{height:55px;font-size:14px}
  .cell{height:108px;border-width:2px;border-radius:7px}
  .number{font-size:42px}
  .word{font-size:12px;margin-top:5px}
  .free .word{font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  .bubble,.bubble.popping,.splash{animation:none}
}

35%{opacity:.8}
  100%{
    transform:
      translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))
      rotate(calc(var(--r) + 95deg))
      scale(.25);
    opacity:0;
  }
}

38%{
    transform:translate(-50%,-50%) scale(1.03,1.08);
    opacity:.75;
  }
  100%{
    transform:translate(-50%,-50%) scale(1.30,1.18);
    opacity:0;
    border-radius:46% 55% 43% 58%;
  }
}


/* --- ULTRAREALISTIC SOAP-BUBBLE POP --- */
.bubble.popping{
  animation:none !important;
  overflow:visible;
}
.bubble.popping .membrane-tear,
.bubble.popping .tension-wave,
.bubble.popping .film-fragment,
.bubble.popping .microdrop{
  pointer-events:none;
}

.membrane-tear{
  position:absolute;
  inset:0;
  border-radius:50%;
  z-index:8;
  background:
    radial-gradient(circle at var(--px) var(--py),
      transparent 0 2%,
      rgba(255,255,255,.18) 2.5% 3.2%,
      transparent 3.7% 7%),
    conic-gradient(from 17deg at var(--px) var(--py),
      rgba(255,255,255,.0) 0 7deg,
      rgba(255,255,255,.56) 8deg 10deg,
      rgba(115,210,255,.25) 11deg 13deg,
      rgba(255,120,220,.20) 14deg 16deg,
      rgba(255,255,255,0) 17deg 30deg);
  -webkit-mask:
    radial-gradient(circle at var(--px) var(--py),
      transparent 0 5%,
      #000 6% 18%,
      transparent 19% 100%);
  mask:
    radial-gradient(circle at var(--px) var(--py),
      transparent 0 5%,
      #000 6% 18%,
      transparent 19% 100%);
  opacity:.95;
  animation:tearExpand 270ms cubic-bezier(.12,.72,.18,1) forwards;
}
@keyframes tearExpand{
  0%{
    -webkit-mask-size:35% 35%;
    mask-size:35% 35%;
    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;
    -webkit-mask-position:var(--px) var(--py);
    mask-position:var(--px) var(--py);
    opacity:.98;
  }
  48%{opacity:.82}
  100%{
    -webkit-mask-size:260% 260%;
    mask-size:260% 260%;
    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;
    -webkit-mask-position:var(--px) var(--py);
    mask-position:var(--px) var(--py);
    opacity:0;
  }
}

.tension-wave{
  position:absolute;
  left:var(--px);
  top:var(--py);
  width:8px;
  height:8px;
  margin:-4px 0 0 -4px;
  border-radius:50%;
  border:1.6px solid rgba(255,255,255,.82);
  box-shadow:
    0 0 3px rgba(110,205,255,.34),
    inset 0 0 2px rgba(255,135,220,.22);
  z-index:9;
  opacity:.9;
  animation:tensionWave 230ms ease-out forwards;
}
@keyframes tensionWave{
  0%{transform:scale(.25,.18);opacity:.95}
  55%{transform:scale(8.2,7.5);opacity:.52}
  100%{transform:scale(13,11.7);opacity:0}
}

.film-fragment{
  --tx:0px;
  --ty:0px;
  --rot:0deg;
  --sx:1;
  --sy:1;
  position:absolute;
  left:var(--px);
  top:var(--py);
  width:12px;
  height:6px;
  margin:-3px 0 0 -6px;
  z-index:10;
  border-radius:70% 35% 72% 42% / 55% 65% 40% 60%;
  border-top:1px solid rgba(255,255,255,.82);
  border-left:1px solid rgba(255,255,255,.38);
  background:
    linear-gradient(130deg,
      rgba(255,255,255,.68),
      rgba(110,210,255,.26) 38%,
      rgba(255,125,220,.22) 68%,
      rgba(255,255,255,.06));
  box-shadow:inset 0 0 2px rgba(255,255,255,.72);
  transform-origin:center;
  animation:filmFly 290ms cubic-bezier(.16,.68,.22,1) forwards;
}
@keyframes filmFly{
  0%{
    transform:translate(0,0) rotate(var(--rot)) scale(var(--sx),var(--sy)) skewX(0deg);
    opacity:.92;
  }
  35%{
    opacity:.78;
    transform:
      translate(calc(var(--tx)*.35),calc(var(--ty)*.35))
      rotate(calc(var(--rot) + 24deg))
      scale(calc(var(--sx)*.95),calc(var(--sy)*1.08))
      skewX(8deg);
  }
  100%{
    transform:
      translate(var(--tx),var(--ty))
      rotate(calc(var(--rot) + 88deg))
      scale(calc(var(--sx)*.42),calc(var(--sy)*.62))
      skewX(18deg);
    opacity:0;
  }
}

.microdrop{
  --tx:0px;
  --ty:0px;
  --d:2px;
  position:absolute;
  left:var(--px);
  top:var(--py);
  width:var(--d);
  height:var(--d);
  margin:calc(var(--d)*-.5) 0 0 calc(var(--d)*-.5);
  z-index:11;
  border-radius:50%;
  background:rgba(255,255,255,.72);
  box-shadow:0 0 1px rgba(105,205,255,.42);
  opacity:.88;
  animation:microFly 240ms ease-out forwards;
}
@keyframes microFly{
  0%{transform:translate(0,0) scale(1);opacity:.9}
  100%{transform:translate(var(--tx),var(--ty)) scale(.35);opacity:0}
}

/* The original membrane loses continuity from the click point outward,
   rather than shrinking or fading as a whole. */
.bubble.popping{
  -webkit-mask:
    radial-gradient(circle at var(--px) var(--py),
      transparent 0 0%,
      #000 1% 100%);
  mask:
    radial-gradient(circle at var(--px) var(--py),
      transparent 0 0%,
      #000 1% 100%);
  animation:membraneCollapse 285ms cubic-bezier(.12,.7,.18,1) forwards !important;
}
@keyframes membraneCollapse{
  0%{
    -webkit-mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 1%,
        #000 1.5% 100%);
    mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 1%,
        #000 1.5% 100%);
    filter:none;
    opacity:.95;
  }
  22%{
    -webkit-mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 8%,
        #000 10% 100%);
    mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 8%,
        #000 10% 100%);
    opacity:.92;
  }
  52%{
    -webkit-mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 35%,
        #000 38% 100%);
    mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 35%,
        #000 38% 100%);
    opacity:.82;
  }
  78%{
    -webkit-mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 67%,
        #000 71% 100%);
    mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 67%,
        #000 71% 100%);
    opacity:.58;
  }
  100%{
    -webkit-mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 103%,
        #000 104% 100%);
    mask:
      radial-gradient(circle at var(--px) var(--py),
        transparent 0 103%,
        #000 104% 100%);
    opacity:0;
  }
}

</style>
</head>
<body>
<div class="wrap">
  <h1>¡BINGO!</h1>
  <div class="instructions">Click on a box to mark it. Click again to pop the bubble!</div>
  <div id="board" class="board" aria-label="Spanish numbers bingo card"></div>
  <div class="controls"><button id="newCard" type="button">Generate a new card</button></div>
</div>
<script>
(()=>{
  const board=document.getElementById('board');
  const newCard=document.getElementById('newCard');

  const groups=[
    {name:'AMARILLO', cls:'yellow', start:0, end:20, count:5},
    {name:'AZUL', cls:'blue', start:21, end:40, count:5},
    {name:'ROJO', cls:'red', start:41, end:60, count:4},
    {name:'VERDE', cls:'green', start:61, end:80, count:5},
    {name:'MORADO', cls:'purple', start:81, end:100, count:5}
  ];

  function numberWord(n){
    const base={
      0:'cero',1:'uno',2:'dos',3:'tres',4:'cuatro',5:'cinco',6:'seis',7:'siete',8:'ocho',9:'nueve',
      10:'diez',11:'once',12:'doce',13:'trece',14:'catorce',15:'quince',16:'dieciséis',17:'diecisiete',
      18:'dieciocho',19:'diecinueve',20:'veinte',21:'veintiuno',22:'veintidós',23:'veintitrés',
      24:'veinticuatro',25:'veinticinco',26:'veintiséis',27:'veintisiete',28:'veintiocho',29:'veintinueve',
      30:'treinta',40:'cuarenta',50:'cincuenta',60:'sesenta',70:'setenta',80:'ochenta',90:'noventa',100:'cien'
    };
    if(base[n]) return base[n];
    const tens=Math.floor(n/10)*10, ones=n%10;
    return base[tens]+' y '+base[ones];
  }

  function sample(start,end,count){
    const a=[];
    for(let n=start;n<=end;n++) a.push(n);
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a.slice(0,count);
  }

  function markCell(cell,event){
    const existing=cell.querySelector('.bubble');

    if(!existing){
      const b=document.createElement('span');
      b.className='bubble';
      b.setAttribute('aria-hidden','true');
      cell.appendChild(b);
      cell.setAttribute('aria-pressed','true');
      return;
    }

    if(existing.classList.contains('popping')) return;

    const rect=existing.getBoundingClientRect();
    const clickX=event ? Math.max(0,Math.min(rect.width,event.clientX-rect.left)) : rect.width/2;
    const clickY=event ? Math.max(0,Math.min(rect.height,event.clientY-rect.top)) : rect.height/2;
    const px=(clickX/rect.width)*100;
    const py=(clickY/rect.height)*100;

    existing.style.setProperty('--px',px+'%');
    existing.style.setProperty('--py',py+'%');
    existing.classList.add('popping');
    cell.setAttribute('aria-pressed','false');

    const tear=document.createElement('span');
    tear.className='membrane-tear';
    tear.style.setProperty('--px',px+'%');
    tear.style.setProperty('--py',py+'%');

    const wave=document.createElement('span');
    wave.className='tension-wave';
    wave.style.setProperty('--px',px+'%');
    wave.style.setProperty('--py',py+'%');

    existing.append(tear,wave);

    // Curved translucent membrane fragments. Small count, irregular trajectories.
    const fragments=[
      [-28,-12,-28,1.0,.72],[-18,-30,12,.82,.58],[4,-36,58,.72,.52],
      [24,-27,104,.9,.62],[34,-8,148,.78,.56],[31,17,186,.88,.66],
      [15,30,232,.72,.54],[-8,33,274,.82,.61],[-27,23,316,.9,.63],
      [-34,4,352,.68,.48]
    ];
    fragments.forEach(([tx,ty,rot,sx,sy])=>{
      const f=document.createElement('span');
      f.className='film-fragment';
      f.style.setProperty('--px',px+'%');
      f.style.setProperty('--py',py+'%');
      f.style.setProperty('--tx',tx+'px');
      f.style.setProperty('--ty',ty+'px');
      f.style.setProperty('--rot',rot+'deg');
      f.style.setProperty('--sx',sx);
      f.style.setProperty('--sy',sy);
      existing.appendChild(f);
    });

    // Extremely small transparent droplets around the rupture.
    const drops=[
      [-20,-8,1.5],[-13,-20,2],[-2,-25,1.2],[10,-21,1.6],[21,-11,1.4],
      [25,1,1.8],[18,14,1.3],[8,21,1.7],[-6,23,1.2],[-18,15,1.6],
      [-24,4,1.3],[5,-12,1.1],[-9,8,1.1],[13,7,1.2]
    ];
    drops.forEach(([tx,ty,d])=>{
      const m=document.createElement('span');
      m.className='microdrop';
      m.style.setProperty('--px',px+'%');
      m.style.setProperty('--py',py+'%');
      m.style.setProperty('--tx',tx+'px');
      m.style.setProperty('--ty',ty+'px');
      m.style.setProperty('--d',d+'px');
      existing.appendChild(m);
    });

    setTimeout(()=>existing.remove(),320);
  }

  function makeCell(n,cls){
    const cell=document.createElement('button');
    cell.type='button';
    cell.className='cell '+cls;
    cell.setAttribute('aria-label',n+' '+numberWord(n));
    cell.setAttribute('aria-pressed','false');

    const num=document.createElement('div');
    num.className='number';
    num.textContent=n;
    const word=document.createElement('div');
    word.className='word';
    word.textContent=numberWord(n);
    cell.append(num,word);
    cell.addEventListener('click',(event)=>markCell(cell,event));
    return cell;
  }

  function makeFree(){
    const cell=document.createElement('button');
    cell.type='button';
    cell.className='cell red free';
    cell.setAttribute('aria-label','Free space');
    cell.setAttribute('aria-pressed','false');

    const word=document.createElement('div');
    word.className='word';
    word.textContent='FREE';

    cell.appendChild(word);
    cell.addEventListener('click',(event)=>markCell(cell,event));
    return cell;
  }

  function render(){
    board.replaceChildren();

    groups.forEach(g=>{
      const h=document.createElement('div');
      h.className='header '+g.cls;
      h.textContent=g.name;
      board.appendChild(h);
    });

    const cols=groups.map(g=>sample(g.start,g.end,g.count));
    let redIndex=0;

    for(let row=0;row<5;row++){
      for(let col=0;col<5;col++){
        if(row===2 && col===2){
          board.appendChild(makeFree());
          continue;
        }
        let n;
        if(col===2){
          n=cols[col][redIndex++];
        }else{
          n=cols[col][row];
        }
        board.appendChild(makeCell(n,groups[col].cls));
      }
    }
  }

  newCard.addEventListener('click',render);
  render();
})();
</script>
</body>
</html>
