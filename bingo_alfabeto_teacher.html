<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alphabet Bingo — Teacher</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fb;color:#18243a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1050px;margin:auto;padding:24px}h1{margin:0;text-align:center;font-size:clamp(38px,6vw,66px);font-weight:1000}.sub{text-align:center;color:#667085;font-size:18px;margin:5px 0 18px}.wrap{display:flex;justify-content:center}.card{width:min(470px,90vw);min-height:310px;border:7px solid;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#000}.big{font-size:clamp(130px,20vw,220px);font-weight:1000;line-height:.75}.word{font-size:clamp(42px,7vw,76px);font-weight:950;line-height:1;margin-top:30px;text-align:center;overflow-wrap:anywhere}.y{background:#fff36a;border-color:#d9c900}.b{background:#8fd3ff;border-color:#318dc7}.r{background:#ff987f;border-color:#cf5c45}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:18px 0 24px}button{min-height:52px;padding:11px 22px;border:0;border-radius:14px;font-size:18px;font-weight:900;color:white;background:#087ee7;cursor:pointer;box-shadow:0 4px 0 #075da9}button.secondary{background:#596579;box-shadow:0 4px 0 #3e4756}button.reset{background:#b42318;box-shadow:0 4px 0 #7f1d14}button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}h2{font-size:24px;margin:0 0 10px}.history{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}.tile{height:104px;border:3px solid;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000;padding:5px}.tl{font-size:45px;font-weight:1000;line-height:.9}.tn{font-size:15px;font-weight:850;margin-top:7px;text-align:center;line-height:1.05}.empty,.status{color:#667085}.status{text-align:center;font-weight:750;margin-top:12px}@media(max-width:600px){main{padding:14px}.card{min-height:260px}.history{grid-template-columns:repeat(4,1fr)}.tile{height:88px}.tl{font-size:36px}.tn{font-size:12px}}
</style></head><body><main><h1>BINGO · EL ALFABETO</h1><div class="sub">Teacher caller</div><div class="wrap"><section id="card" class="card y" aria-live="polite"><div id="letter" class="big">—</div><div id="word" class="word">Ready</div></section></div><div class="controls"><button id="prev" class="secondary" type="button">Previous</button><button id="next" type="button">Next call</button><button id="reset" class="reset" type="button">Reset</button></div><h2>Calls already made</h2><div id="history" class="history"></div><div id="status" class="status"></div></main>
<script>
(()=>{const items=[["A", "a"], ["B", "be"], ["C", "ce"], ["D", "de"], ["E", "e"], ["F", "efe"], ["G", "ge"], ["H", "hache"], ["I", "i"], ["J", "jota"], ["K", "ka"], ["L", "ele"], ["M", "eme"], ["N", "ene"], ["Ñ", "eñe"], ["O", "o"], ["P", "pe"], ["Q", "cu"], ["R", "erre"], ["S", "ese"], ["T", "te"], ["U", "u"], ["V", "uve"], ["W", "uve doble"], ["X", "equis"], ["Y", "ye"], ["Z", "zeta"]],card=document.getElementById('card'),le=document.getElementById('letter'),wo=document.getElementById('word'),hist=document.getElementById('history'),status=document.getElementById('status'),prev=document.getElementById('prev'),next=document.getElementById('next'),reset=document.getElementById('reset');let deck=[],i=-1;const cls=l=>'ABCDEFGHI'.includes(l)?'y':'JKLMNÑOPQ'.includes(l)?'b':'r';function shuffle(a){a=a.slice();for(let x=a.length-1;x>0;x--){let j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}function render(){if(i<0){card.className='card y';le.textContent='—';wo.textContent='Ready';hist.innerHTML='<div class="empty">No calls yet.</div>';prev.disabled=true;next.disabled=false;status.textContent='0 of '+deck.length+' letters called';return}let [l,n]=deck[i];card.className='card '+cls(l);le.textContent=l;wo.textContent=n;hist.innerHTML='';deck.slice(0,i+1).forEach(([a,b])=>{let t=document.createElement('div');t.className='tile '+cls(a);let x=document.createElement('div');x.className='tl';x.textContent=a;let y=document.createElement('div');y.className='tn';y.textContent=b;t.append(x,y);hist.append(t)});prev.disabled=i<=0;next.disabled=i>=deck.length-1;status.textContent=(i+1)+' of '+deck.length+' letters called'+(i===deck.length-1?' · All letters have been called.':'')}function resetGame(){deck=shuffle(items);i=-1;render()}next.addEventListener('click',()=>{if(i<deck.length-1){i++;render()}});prev.addEventListener('click',()=>{if(i>0){i--;render()}});reset.addEventListener('click',resetGame);resetGame()})();
</script></body></html>
