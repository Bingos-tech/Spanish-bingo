<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINGO • LOS NÚMEROS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#17233a;font-family:Arial,sans-serif}.w{max-width:1180px;margin:auto;padding:12px 30px 16px}h1{text-align:center;margin:0;font-size:clamp(42px,5.4vw,68px);font-weight:900;line-height:1}.sub{text-align:center;color:#707a90;font-size:19px;margin:6px 0 10px}.card{width:520px;height:300px;max-width:82vw;margin:auto;border:8px solid;border-radius:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#000}.num{font-size:155px;line-height:.82;font-weight:1000}.word{font-size:50px;font-weight:1000;text-align:center;margin-top:20px}.buttons{display:flex;justify-content:center;gap:14px;margin:12px 0 14px}button{border:0;border-radius:16px;padding:13px 27px;color:white;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 6px #3335}#prev{background:#69758c}#next{background:#1285e6}#reset{background:#c8271c}button:disabled{opacity:.45}h2{font-size:25px;margin:4px 0 8px}.history{display:flex;gap:12px;flex-wrap:wrap}.tile{width:108px;height:92px;border:4px solid #111;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000;text-align:center;padding:5px}.tile .tn{font-size:40px;font-weight:1000;line-height:.9}.tile .tw{font-size:14px;font-weight:900;line-height:1.05;margin-top:9px}.count{text-align:center;color:#707a90;font-size:17px;font-weight:bold;margin-top:7px}.yellow{background:#fff36a;border-color:#d9c900}.blue{background:#8fd3ff;border-color:#318dc7}.red{background:#ff987f;border-color:#cf5c45}.green{background:#8ddd72;border-color:#45a13f}.purple{background:#c9b5f7;border-color:#846cc3}
@media (max-height:800px){
 .w{padding-top:8px}
 h1{font-size:52px}
 .sub{font-size:17px;margin:4px 0 7px}
 .card{width:460px;height:245px}
 .num{font-size:128px}
 .word{font-size:42px;margin-top:14px}
 .buttons{margin:9px 0 10px}
 button{padding:10px 24px;font-size:18px}
 h2{font-size:22px;margin:2px 0 6px}
 .tile{width:98px;height:80px}
 .tile .tn{font-size:34px}
 .tile .tw{font-size:12px;margin-top:5px}
 .count{font-size:15px;margin-top:5px}
}
</style></head>
<body><div class="w"><h1>BINGO • LOS NÚMEROS</h1><div class="sub">Teacher caller · 0–100</div><div id="card" class="card blue"><div class="num">—</div><div class="word">Ready?</div></div><div class="buttons"><button id="prev">Previous</button><button id="next">Next call</button><button id="reset">Reset</button></div><h2>Calls already made</h2><div id="history" class="history"></div><div id="count" class="count">0 of 101 numbers called</div></div>
<script>
const o=["cero","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"],sp={10:"diez",11:"once",12:"doce",13:"trece",14:"catorce",15:"quince",16:"dieciséis",17:"diecisiete",18:"dieciocho",19:"diecinueve",20:"veinte",21:"veintiuno",22:"veintidós",23:"veintitrés",24:"veinticuatro",25:"veinticinco",26:"veintiséis",27:"veintisiete",28:"veintiocho",29:"veintinueve",100:"cien"},ts={30:"treinta",40:"cuarenta",50:"cincuenta",60:"sesenta",70:"setenta",80:"ochenta",90:"noventa"};
function wd(n){if(n<10)return o[n];if(sp[n])return sp[n];let t=Math.floor(n/10)*10,u=n%10;return u?ts[t]+" y "+o[u]:ts[t]}function cl(n){return n<=20?"yellow":n<=40?"blue":n<=60?"red":n<=80?"green":"purple"}function sh(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let deck=[],called=[];const card=document.querySelector("#card"),history=document.querySelector("#history"),count=document.querySelector("#count"),prev=document.querySelector("#prev"),next=document.querySelector("#next");
function show(n){card.className="card "+cl(n);card.innerHTML='<div class="num">'+n+'</div><div class="word">'+wd(n)+'</div>'}
function render(){history.innerHTML="";called.slice().reverse().forEach(n=>{let d=document.createElement("div");d.className="tile "+cl(n);d.innerHTML='<div class="tn">'+n+'</div><div class="tw">'+wd(n)+'</div>';history.appendChild(d)});count.textContent=called.length+" of 101 numbers called";prev.disabled=called.length<2;next.disabled=called.length>=101}
function reset(){deck=sh([...Array(101).keys()]);called=[];card.className="card blue";card.innerHTML='<div class="num">—</div><div class="word">Ready?</div>';render()}
next.onclick=()=>{if(called.length<101){let n=deck[called.length];called.push(n);show(n);render()}};prev.onclick=()=>{if(called.length>1){called.pop();show(called[called.length-1]);render()}};document.querySelector("#reset").onclick=reset;reset();
</script></body></html>
