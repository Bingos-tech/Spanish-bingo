<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Builder | Unit 2 Test Day 1</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,#263c75,#0c1530 58%,#080e20);color:#f6f8ff;font-family:system-ui,-apple-system,Arial,sans-serif;min-height:100vh}main{max-width:1080px;margin:auto;padding:24px 18px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.eyebrow{color:#91d9ff;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(30px,5vw,49px);margin:10px 0 5px;line-height:1.1}.sub{color:#b7c7e7;margin:0 0 20px}.panel{background:#15264c;border:1px solid #39558b;border-radius:22px;padding:22px;box-shadow:0 15px 40px #0004}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.stat{background:#223762;padding:9px 15px;border-radius:14px;font-weight:800}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;background:#6be7c5;color:#08192d;padding:12px 18px;font-weight:850;transition:transform .1s,filter .15s}button:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}button:disabled{opacity:.43;cursor:not-allowed}.secondary{background:#344c7d;color:white}.danger{background:#ffbb69;color:#20172a}.option{background:#293e70;color:#fff;border:2px solid #5069a0;min-height:58px}.option.correct{background:#167f61;border-color:#76ffd6}.option.wrong{background:#9c3650;border-color:#ff9caf}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prompt{font-size:clamp(23px,3.4vw,34px);font-weight:850;margin:16px 0}.hint{color:#b9c9e9}.feedback{min-height:32px;font-size:19px;font-weight:800;margin:14px 0}.good{color:#80ffd5}.bad{color:#ffb3b3}.tile{background:#2d467e;color:white;border:2px solid #6983b8;font-size:20px}.answer{min-height:60px;background:#0c1936;border:2px dashed #7790bf;border-radius:14px;padding:16px;font-size:23px;font-weight:800;margin:15px 0}.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.center{text-align:center}.art{font-size:clamp(54px,9vw,100px);line-height:1.3}.cardgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.memory{min-height:105px;padding:10px 5px;background:#293d72;color:white;border:2px solid #506eab;font-size:clamp(13px,1.7vw,18px);overflow-wrap:anywhere}.memory.open{background:#fff;color:#11224c}.memory.matched{background:#175e54;color:#e8fff8;border-color:#62e3bb}.memory .back{font-size:32px}.small{font-size:13px;color:#bdd0ed}footer{margin-top:25px;color:#8ca2c9;font-size:13px}label{font-weight:800}select,input{border:1px solid #8198c8;border-radius:10px;padding:11px;background:#f6f9ff;color:#142244}input{width:100%;max-width:480px}.pill{border-radius:999px;background:#3c3577;color:#e8dbff;padding:7px 12px;font-weight:800}.hidden{display:none!important}@media(max-width:650px){.cardgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.choices{grid-template-columns:1fr}.memory{min-height:90px}main{padding:16px 12px}.panel{padding:16px}}</style></head><body><main><header><div class="eyebrow">UNIT 2 · TEST REVIEW #1 · VOCABULARY & GRAMMAR</div><span class="pill">Offline • No login</span></header><h1>Word Builder</h1><p class="sub">Build food, animal and adjective vocabulary from Test Review #1.</p><div id="stats" class="stats"></div><section class="panel"><div id="game"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div></section><footer>Study practice for Unit 2, Test Day 1. Your answers stay on this device. No accounts, tracking, or external resources.</footer></main><script>const $=s=>document.querySelector(s), rnd=a=>a[Math.floor(Math.random()*a.length)], shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}, esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let score=0,round=0,total=0,locked=false;function stats(){ $('#stats').innerHTML=`<span class="stat">⭐ Score: ${score}</span><span class="stat">🎯 Round: ${Math.min(round+1,total)} / ${total}</span>`}function msg(t,ok){$('#feedback').textContent=t;$('#feedback').className='feedback '+(ok?'good':'bad')}function finish(){locked=true;$('#game').innerHTML=`<div class="center"><div class="art">🏆</div><h2>Great practice!</h2><p class="prompt">${score} / ${total} correct</p><p>Play again to strengthen your Spanish before Test Day 1.</p><button onclick="start()">Play again ↻</button></div>`;$('#feedback').textContent='';stats()}function options(correct,wrong,cb){let all=shuffle([correct,...shuffle(wrong.filter(x=>x!==correct)).slice(0,3)]);$('#choices').innerHTML=all.map((x,i)=>`<button class="option" data-i="${i}">${esc(x)}</button>`).join('');[...$('#choices').children].forEach((b,i)=>b.onclick=()=>{if(locked)return;locked=true;let ok=all[i]===correct;if(ok){score++;b.classList.add('correct');msg('✓ Correct!',true)}else{b.classList.add('wrong');[...$('#choices').children].find(q=>q.textContent===correct)?.classList.add('correct');msg('Not quite. Correct answer: '+correct,false)}stats();$('#next').classList.remove('hidden');cb?.(ok)})}function advance(){round++;locked=false;msg('',true);$('#next')?.classList.add('hidden');if(round>=total)finish();else render();stats()}
const items=[["el gazpacho", "cold tomato soup", "🥣"], ["el huevo", "egg", "🥚"], ["la tortilla de patatas", "Spanish potato omelet", "🍳"], ["el pescado", "fish (food)", "🐟"], ["el tomate", "tomato", "🍅"], ["el arroz", "rice", "🍚"], ["la patata", "potato", "🥔"], ["el gato", "cat", "🐈"], ["la vaca", "cow", "🐄"], ["el pájaro", "bird", "🐦"], ["la tortuga", "tortoise", "🐢"], ["el mono", "monkey", "🐒"], ["el caballo", "horse", "🐎"], ["la serpiente", "snake", "🐍"], ["el perro", "dog", "🐕"], ["el pez", "fish (animal)", "🐠"], ["la cobaya", "guinea pig", "🐹"]],adj=[["feo", "lindo", "ugly", "cute"], ["divertido", "aburrido", "fun", "boring"], ["tranquilo", "nervioso", "calm", "nervous"], ["trabajador", "perezoso", "hardworking", "lazy"], ["simpático", "antipático", "friendly", "unfriendly"], ["rápido", "lento", "fast", "slow"], ["tímido", "sociable", "shy", "sociable"], ["inteligente", "tonto", "intelligent", "silly"]];let bank=[],current=null,level='easy',cat='all',tokens=[],chosen=[],attempts=0;function start(){level=$('#level')?.value||'easy';cat=$('#category')?.value||'all';let b=cat==='food'?items.slice(0,7):cat==='animals'?items.slice(7):cat==='adjectives'?[]:items;bank=shuffle(b.map(x=>({answer:x[0],english:x[1],pic:x[2]})).concat(cat==='adjectives'||cat==='all'?adj.flatMap(a=>[{answer:a[1],english:'Opposite of '+a[0],pic:'↔️'},{answer:a[0],english:'Opposite of '+a[1],pic:'↔️'}]):[]));score=round=attempts=0;total=bank.length;$('#game').innerHTML=`<div class="controls"><label>Category <select id="category"><option value="all">All vocabulary</option><option value="food">Food</option><option value="animals">Animals</option><option value="adjectives">Adjective opposites</option></select></label><label>Level <select id="level"><option value="easy">Easy · word tiles</option><option value="medium">Medium · letter tiles</option><option value="challenge">Challenge · type it</option></select></label><button class="secondary" onclick="start()">Restart ↻</button></div><div id="task"></div><button class="secondary hidden" id="next" onclick="advance()">Next →</button>`;$('#category').value=cat;$('#level').value=level;$('#category').onchange=start;$('#level').onchange=start;render();stats()}function render(){current=bank[round];chosen=[];locked=false;let isAdj=current.pic==='↔️';let showEnglish=level!=='challenge';let hint=isAdj?'Find the opposite adjective':current.english;let hintHtml=showEnglish?`<p class="hint">English clue: <strong>${esc(hint)}</strong></p>`:`<button class="secondary" id="hintbtn">Show English hint</button><p class="hint hidden" id="hinttext">${esc(hint)}</p>`;let pic=`<div class="art">${current.pic}</div>`;let tiles='';if(level==='easy'){tokens=shuffle(current.answer.split(' '));tiles=makeTiles()}else if(level==='medium'){tokens=shuffle([...current.answer].filter(c=>c!==' '));tiles=makeTiles()}else{tiles=`<input id="typed" autocomplete="off" spellcheck="false" placeholder="Type the Spanish answer"><div class="controls"><button id="check">Check answer ✓</button></div>`}$('#task').innerHTML=`<div class="center">${pic}<div class="prompt">${isAdj?'Adjective opposites':'What is this in Spanish?'}</div>${hintHtml}<p class="small">${level==='easy'?'Tap the words in order.':level==='medium'?'Tap the letters in order (spaces are added automatically).':'Type the full Spanish expression, including its article when needed.'}</p><div id="answer" class="answer">${level==='challenge'?'Your answer':'Tap tiles below'}</div><div id="tiles" class="chips">${tiles}</div></div>`;if(level==='challenge'){$('#answer').classList.add('hidden');$('#typed').onkeydown=e=>{if(e.key==='Enter')check()};$('#check').onclick=check}else bindTiles();if($('#hintbtn'))$('#hintbtn').onclick=()=>$('#hinttext').classList.remove('hidden');$('#next').classList.add('hidden')}function makeTiles(){return tokens.map((t,i)=>`<button class="tile" data-i="${i}">${esc(t)}</button>`).join('')+`<button class="secondary" id="undo">Undo ↶</button><button id="check">Check ✓</button>`}function bindTiles(){[...$('#tiles').querySelectorAll('[data-i]')].forEach(b=>b.onclick=()=>{if(locked)return;chosen.push(+b.dataset.i);b.disabled=true;$('#answer').textContent=chosen.map(i=>tokens[i]).join(level==='easy'?' ':'')});$('#undo').onclick=()=>{chosen.pop();[...$('#tiles').querySelectorAll('[data-i]')].forEach(b=>b.disabled=chosen.includes(+b.dataset.i));$('#answer').textContent=chosen.length?chosen.map(i=>tokens[i]).join(level==='easy'?' ':''):'Tap tiles below'};$('#check').onclick=check}function norm(s){return s.toLowerCase().normalize('NFC').trim().replace(/\s+/g,' ')}function check(){if(locked)return;let answer=level==='challenge'?$('#typed').value:chosen.map(i=>tokens[i]).join(level==='easy'?' ':'');let valid=level==='medium'?norm(answer).replace(/ /g,'')===norm(current.answer).replace(/ /g,''):norm(answer)===norm(current.answer);locked=true;if(valid){score++;msg('✓ Correct! '+current.answer,true)}else msg('Correct answer: '+current.answer,false);$('#next').classList.remove('hidden');stats()}start();</script></body></html>
